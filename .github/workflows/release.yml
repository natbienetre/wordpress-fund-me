name: Release

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    name: Build release
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@v6
      with:
        path: vendor
        key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-

    - name: Build release
      run: composer run-script build

    - name: Version
      id: version
      run: |-
        echo FUNDME_VERSION="$(composer run-script version)" >> "$GITHUB_OUTPUT"
        git log $(git describe --tags --abbrev=0)..HEAD --oneline > changes.txt

    - name: Create draft release
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: "v${{ steps.version.outputs.FUNDME_VERSION }}"
      run: |-
        gh release create "$RELEASE_TAG" fund-me.zip \
          --draft \
          --notes-file changes.txt \
          --title "$RELEASE_TAG"
