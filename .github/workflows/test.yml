name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Validate composer.json and composer.lock
      run: composer validate --strict

    - name: Test WordPress plugin
      id: tests
      uses: holyhope/test-wordpress-plugin-github-action@1e7895de5852603e93a8e92afe9d008b76521355 # v2.0.4
      with:
        plugin_slug: fund-me
        php_version: '8.3'

    - name: Publish Test Report
      uses: mikepenz/action-junit-report@3585e9575db828022551b4231f165eb59a0e74e3 # v5.6.2
      if: always()
      with:
        report_paths: ${{ steps.tests.outputs.junit_report }}
