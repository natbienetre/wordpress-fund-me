name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  checks: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Validate composer.json and composer.lock
      run: composer validate --strict

    - name: Test WordPress plugin
      id: tests
      uses: holyhope/test-wordpress-plugin-github-action@1e7895de5852603e93a8e92afe9d008b76521355
      with:
        plugin_slug: fund-me
        php_version: '8.3'

    - name: Publish Test Report
      uses: mikepenz/action-junit-report@v6
      if: always()
      with:
        report_paths: ${{ steps.tests.outputs.junit_report }}
