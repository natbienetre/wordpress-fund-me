name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  checks: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Install Subversion
      run: sudo apt-get update && sudo apt-get install -y subversion

    - name: Start MySQL
      run: |-
        sudo /etc/init.d/mysql start
        mysql -e 'CREATE DATABASE IF NOT EXISTS wordpress;' -uroot -proot
    
    - uses: actions/checkout@v7
      with:
        path: wordpress/wp-content/plugins/fund-me

    - name: Validate composer.json and composer.lock
      working-directory: ./wordpress/wp-content/plugins/fund-me
      run: composer validate --strict

    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@v6
      with:
        path: ./wordpress/wp-content/plugins/fund-me/vendor
        key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-

    - name: Install dependencies
      working-directory: ./wordpress/wp-content/plugins/fund-me
      run: composer install --prefer-dist --no-progress

    - name: Install WordPress
      run: |-
        ./wordpress/wp-content/plugins/fund-me/vendor/bin/wp core download --path=wordpress --force --quiet
        ./wordpress/wp-content/plugins/fund-me/vendor/bin/wp config create --path=wordpress --dbname=wordpress --dbuser=root --dbpass=root
        ./wordpress/wp-content/plugins/fund-me/vendor/bin/wp core install --path=./wordpress --url=localhost --title=WordPress --admin_user=admin --admin_password=password --admin_email=wordpress@github.fund-me.com

    - name: Run test suite
      working-directory: ./wordpress/wp-content/plugins/fund-me
      run: composer run-script ci-test

    - name: Publish Test Report
      uses: mikepenz/action-junit-report@v6
      if: always()
      with:
        report_paths: './wordpress/wp-content/plugins/fund-me/junit-result.xml'
